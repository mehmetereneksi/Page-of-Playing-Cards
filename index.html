<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <h2>A</h2>
        <h2>♠</h2>
      </div>
      <div class="middle single">
        <h1>♠</h1>
      </div>
      <div class="right">
        <h2>A</h2>
        <h2>♠</h2>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <h2>2</h2>
        <h2>♣</h2>
      </div>
      <div class="middle">
        <h1>♣</h1>
        <h1 class="upside-down">♣</h1>
      </div>
      <div class="right">
        <h2>2</h2>
        <h2>♣</h2>
      </div>
    </div>
    <div class="card red">
      <div class="left">
        <h2>3</h2>
        <h2>♥</h2>
      </div>
      <div class="middle">
        <h1>♥</h1>
        <h1>♥</h1>
        <h1 class="upside-down">♥</h1>
      </div>
      <div class="right">
        <h2>3</h2>
        <h2>♥</h2>
      </div>
    </div>
  </main>
</body>

</html>
